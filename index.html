<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Dim1xs</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
		<link rel="stylesheet" type="text/css" href="/static/style.css">
		<link rel="icon" href="/static/img/favicon.ico">
    </head>
    <body>
        <div class="portfolio-card">
            <img 
            src="https://github.com/Dim1xs.png" 
            alt="Developer Avatar" 
            class="avatar"/>

            <h2 class="name"> ( Dim1xs )</h2>
            <p class="country"></p>
            <p class="title"></p>

            <p class="bio">
                lua my beloved
            </p>

            <div class="socials">
            <a href="https://github.com/Dim1xs" target="_blank" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://www.youtube.com/@Dim1xs" target="_blank" title="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="https://steamcommunity.com/id/dim1xs/" target="_blank" title="Steam">
                <i class="fab fa-steam"></i>
            </a>
            <a href="https://dim1xs.github.io/site-hl2gmedwiki/" target="_blank" title="HL2GMed Wiki">
                <i class="fa fa-archive"></i>
            </a>
            </div>

            <a href="https://github.com/Dim1xs?tab=repositories" class="btn" target="_blank">
            View My Work
            </a>
        </div>
        <script>
            fetch(`https://api.github.com/users/Dim1xs`)
            .then(res => res.json())
            .then(data => {
                document.querySelector('.avatar').src = data.avatar_url;
                document.querySelector('.name').textContent = data.name + document.querySelector('.name').textContent;
                document.querySelector('.country').textContent = data.location;
                document.querySelector('.title').textContent = 'Followers: ' + data.followers;
                document.querySelector('.bio').textContent = data.bio;
            })
            .catch(err => console.warn("Could not fetch GitHub data:", err));
        </script>
    </body> 
</html>
