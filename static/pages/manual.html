<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <meta charset="utf-8">
        <title>HL2GMed - Manual</title>
		<link rel="stylesheet" type="text/css" href="/static/style.css">
		<link rel="icon" href="/static/img/favicon.ico">
        <script src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs@2/webcomponents-loader.min.js"></script>
        <script type="module">
            import markedFootnote from 'https://cdn.jsdelivr.net/npm/marked-footnote@1/+esm'
            import ZeroMd, { STYLES } from 'https://cdn.jsdelivr.net/npm/zero-md@3'

            customElements.define('zero-md', class extends ZeroMd {
                async load() {
                await super.load()
                this.marked.use(markedFootnote());
                this.template = `
                    <style>
                    :host { display: block; position: relative; contain: content; }
                    :host([hidden]) { display: none; }
                    .note {
                        background-color: #ffa;
                        box-sizing: border-box;
                        border: 1px solid black;
                        border-radius: 4px;
                        width: auto;
                        margin: 10px 10px;
                        padding: 10px;
                        white-space: pre-line;
                    }
                    </style>
                    <link rel="stylesheet" media="(prefers-color-scheme:dark)" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github-dark.min.css" />`
                }
            })
        </script>
        <script src="/base.js"> </script>
    </head>
    <body>
        <div class="notice">Welcome to <b>HL2GMed Wiki</b>!<br> Fresh rewrite, with markdown support!<br><a href="https://github.com/Dim1xs/site-hl2gmedwiki">View Source Code</a></div>
        <div id="document">
			<div id="header">
                <div id="navbar">
                    <div id="logo"></div>
                    <div class="links">
                        <a href="/">Home</a>
                        <a style="font-weight: bold;" href="https://discord.com/invite/5er8wTvQu7">Discord Server</a>
                    </div>
                </div>
			</div>
			<div id="content">
                <div class="note"><b>NOTE:</b><br><i>This page is under construction.</i></div>
			</div>
            <div id="footer">
                <ul id="footer-info">
                    <li id="footer-info-lastmod"> This page was last modified on 16 March 2011, at 19:59.</li>
                    <li id="footer-info-thanks">Thank you, for opening this page</li>
                </ul>
            </div>
		</div>
    </body>
</html>
